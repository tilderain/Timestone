name: build

on:
  push:
    branches: [ "movement" ]
  pull_request:
    branches: [ "movement" ]

permissions:
  contents: write   # softprops/action-gh-release
  actions: write    # delete workflow artifacts after publishing

jobs:
  build:
    #runs-on: [self-hosted, nixos]
    runs-on: ubuntu-latest
    # Runs for fork PRs too: GitHub gives fork PRs a read-only GITHUB_TOKEN and no secrets, so a PR build can't sign, release or push.
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
    - uses: actions/checkout@v7

    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

    # Nix caching to allow faster builds via deps
    - name: Enable Nix cache (GitHub Actions)
      uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      with:
        use-flakehub: false   # stay in-repo; no third-party cache service
        use-gha-cache: true   # back /nix/store with the Actions cache

    - name: Extract version
      id: version
      run: |
        VERSION="$(awk '/^VERSION[[:space:]]*:=/ {print $3; exit}' Makefile)"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Compute release tag
      id: tag
      run: echo "tag=v${{ steps.version.outputs.version }}" >> "$GITHUB_OUTPUT"

    - name: Build package
      run: nix build .#timestone

    - name: Build Linux installer
      run: nix build .#timestone-install-linux --out-link result-linux

    - name: Stage release assets
      run: |
        mkdir -p dist
        cp -L result/Timestone.asi result/TimestoneInstall.exe result/dinput8.dll result/Timestone-THIRDPARTYNOTICES dist/
        cp -L result-linux/TimestoneInstall.sh dist/   # the Linux installer; a release file of its own

    - name: Upload unsigned artifacts
      id: unsigned
      uses: actions/upload-artifact@v7
      with:
        name: timestone-unsigned
        path: dist/
        retention-days: 14
        if-no-files-found: error

    - name: Upload unsigned Timestone.asi (PR test build)
      id: asi
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@v7
      with:
        path: dist/Timestone.asi
        archive: false   # single file: downloads as Timestone.asi, not a zip
        retention-days: 14
        if-no-files-found: error

    - name: Link the PR test build
      if: github.event_name == 'pull_request'
      env:
        ASI_URL: ${{ steps.asi.outputs.artifact-url }}
        ZIP_URL: ${{ steps.unsigned.outputs.artifact-url }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        {
          echo "## Unsigned PR test build"
          echo ""
          echo "**UNSIGNED, for testing only. This is not a release.** Built from PR head \`${HEAD_SHA:0:7}\` merged into \`movement\`."
          echo ""
          echo "- [Timestone.asi]($ASI_URL): replaces the \`Timestone.asi\` next to \`umvc3.exe\`."
          echo "- [timestone-unsigned]($ZIP_URL): zip of Timestone.asi, TimestoneInstall.exe, TimestoneInstall.sh, dinput8.dll and THIRDPARTYNOTICES."
          echo ""
          echo "The links need a GitHub login and expire after 14 days."
        } >> "$GITHUB_STEP_SUMMARY"

  sign:
    needs: build
    if: github.event_name == 'push'   # PR builds stay unsigned
    runs-on: windows-2025
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: timestone-unsigned
        path: dist

    - name: Unpack zip and stage Timestone binaries for signing
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path sign -Force | Out-Null
        Copy-Item dist\Timestone.asi sign\Timestone.dll -Force   # .asi is a PE DLL; not in ArtifactSigning's type list
        Copy-Item dist\TimestoneInstall.exe sign\ -Force   # dinput8.dll (ASI loader) stays unsigned

    - name: Sign with Azure Artifact Signing
      if: vars.ENABLE_SIGNING == 'true'   # feature flag — set the ENABLE_SIGNING repo variable to 'true' to re-enable
      uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
      with:
        endpoint: https://eus.codesigning.azure.net/
        signing-account-name: Timestone
        #certificate-profile-name: TimestoneTesting
        certificate-profile-name: Timestone
        azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
        azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
        files-folder: ${{ github.workspace }}\sign
        files-folder-filter: dll,exe
        file-digest: SHA256
        timestamp-rfc3161: http://timestamp.acs.microsoft.com
        timestamp-digest: SHA256

    - name: Verify signatures
      if: vars.ENABLE_SIGNING == 'true'
      shell: pwsh
      run: |
        $files = Get-ChildItem sign\*.dll, sign\*.exe
        foreach ($f in $files) {
          $sig = Get-AuthenticodeSignature $f.FullName
          if ($sig.Status -ne 'Valid') {
            throw "Signature invalid for $($f.Name): $($sig.Status)"
          }
          Write-Host "Signed: $($f.Name) status=$($sig.Status) cert=$($sig.SignerCertificate.Subject)"
        }

    - name: Restore .asi name and rebuild zip
      shell: pwsh
      run: |
        Copy-Item sign\Timestone.dll dist\Timestone.asi -Force
        Copy-Item sign\TimestoneInstall.exe dist\ -Force
        # dinput8  is already here
        # Copy-Item dist\dinput8.dll dist\ -Force   # unsigned — original from the zip
        # Remove-Item dist\Timestone.zip -Force
        New-Item -ItemType Directory -Path out -Force | Out-Null
        Compress-Archive -Path dist\dinput8.dll, dist\Timestone.asi, dist\TimestoneInstall.exe, dist\Timestone-THIRDPARTYNOTICES -DestinationPath out\Timestone.zip -CompressionLevel NoCompression
        Copy-Item dist\TimestoneInstall.exe out\ -Force   # also published beside the zip
        Copy-Item dist\TimestoneInstall.sh out\ -Force

    # The installer is what a new player downloads and runs first, so the
    # copy that is published (and the one inside the zip) must be the signed one.
    - name: Check the published installer is signed
      shell: pwsh
      run: |
        if ('${{ vars.ENABLE_SIGNING }}' -ne 'true') {
          Write-Host "::warning title=Unsigned release::ENABLE_SIGNING is not 'true'; TimestoneInstall.exe and Timestone.asi are being published unsigned."
          exit 0
        }
        Expand-Archive out\Timestone.zip -DestinationPath zipcheck -Force
        foreach ($f in 'out\TimestoneInstall.exe', 'zipcheck\TimestoneInstall.exe') {
          $sig = Get-AuthenticodeSignature $f
          if ($sig.Status -ne 'Valid') {
            throw "$f is not signed: $($sig.Status)"
          }
          Write-Host "Signed: $f cert=$($sig.SignerCertificate.Subject)"
        }

    - name: Upload signed artifacts
      uses: actions/upload-artifact@v7
      with:
        name: Timestone-v${{ needs.build.outputs.version }}
        path: out/
        if-no-files-found: error

  release-draft:
    needs: [build, sign]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}   # gh ignores GITHUB_REPOSITORY; needs this or --repo
    outputs:
      created: ${{ steps.check.outputs.exists == 'false' }}
    environment: prerelease   # no protection rules configured; add required reviewers in repo settings to pause here
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: Timestone-v${{ needs.build.outputs.version }}
        path: dist

    - name: Check for existing release
      id: check
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -e
        TAGS="$(gh release list --json tagName --jq '.[].tagName')"
        echo "existing release tags: $TAGS"
        if printf '%s\n' "$TAGS" | grep -qx "${{ needs.build.outputs.tag }}"; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Create draft release
      if: steps.check.outputs.exists == 'false'
      uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
      with:
        tag_name: ${{ needs.build.outputs.tag }}
        name: Timestone ${{ needs.build.outputs.tag }}
        files: |
          dist/Timestone.zip
          dist/TimestoneInstall.exe
          dist/TimestoneInstall.sh
        body: |
          Please join the discord if you are going to test this!!!
          https://discord.gg/BvDNwPzwy4

          MAKE SURE YOU HAVE NO MODS INSTALLED WHEN PLAYING THIS

          To install, download TimestoneInstall.exe and run it. It finds your Marvel 3 folder in Steam and puts the latest Timestone in it.
          On Linux and Steam Deck, download TimestoneInstall.sh instead and run it in a terminal: sh TimestoneInstall.sh

          If you want to manual install instead, extract the contents of Timestone.zip into your marvel folder

          Go to your Marvel 3 install directory, 
          easiest way is go to Steam, right click Marvel 3, and select Manage -> Browse Local Files.
          Unzip the contents of Timestone.zip in the marvel folder. You should have all of the Timestone files and the dinput8.dll files in the same area as the umvc3.exe.
          Have fun getting TAC infinited by dr doom

          There might be an issue with BITDEFENDER. Bitdefender MAY crash your game, please add an exclusion for marvel folder / disable it


          # Credits

          Armonte- Many reverse engineering and documentation, Shot snapshot base, inspiration from his repo (exception handler.. etc)

          Hkhann- Prior reverse engineering, the one who started it all with the OG UMVC3Rollback repo

          catboy_friender (Sheep)- Help with Hkhann's repo, prior reverse engineering

          Eternal Yoshi- Prior reverse engineering, ThreeWorkTool, playtesting

          Ryn (wistfulhopes), anotak, Gneiss, tabsmvc, EddieLopes, dantarion, tge-was-taken - Prior reverse engineering

          Archeroflegend- Framestepper, playtesting and harassment

          Vevota- Playtesting and harassment

          Jasongamedev- Playtesting

          //FIXMESTEVE: : Standby support

          John2143- "Sponsorship", build help and signing, discord bot

          ermaccer- UMVC3Hook

          ThirteenAG- Ultimate ASI Loader



          Those random guys who played with me in an ingame lobby one day
        generate_release_notes: false
        draft: true  # upload assets before publishing locks an immutable release
        prerelease: true

    - name: Publish prerelease
      if: steps.check.outputs.exists == 'false'
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ needs.build.outputs.tag }}
      run: gh release edit "$TAG" --draft=false

    - name: Delete published workflow artifacts
      if: steps.check.outputs.exists == 'false'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        ARTIFACT_IDS="$(gh api --paginate "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[].id')"
        for artifact_id in $ARTIFACT_IDS; do
          gh api --method DELETE "repos/$GH_REPO/actions/artifacts/$artifact_id"
        done

  release:
    needs: [build, release-draft]
    if: ${{ github.event_name == 'push' && needs.release-draft.outputs.created == 'true' }}
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}   # gh ignores GITHUB_REPOSITORY; needs this or --repo
    environment: release   # no protection rules configured; add required reviewers in repo settings to pause here
    steps:
    - name: Promote prerelease to full release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        TAG="${{ needs.build.outputs.tag }}"
        gh release edit "$TAG" --prerelease=false
