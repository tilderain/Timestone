name: build

on:
  push:
    branches: [ "movement" ]
  pull_request:
    branches: [ "movement" ]

permissions:
  contents: write   # softprops/action-gh-release
  actions: write    # actions/upload-artifact & download-artifact (explicit permissions zero unlisted scopes)

jobs:
  build:
    #runs-on: [self-hosted, nixos]
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - uses: actions/checkout@v4

    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@v22

    - name: Extract version
      id: version
      run: |
        VERSION="$(awk '/^VERSION[[:space:]]*:=/ {print $3; exit}' Makefile)"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Build package
      run: nix build .#timestone

    - name: Stage release assets
      run: |
        mkdir -p dist
        cp -L result/Timestone.zip result/Timestone.asi result/TimestoneUpdater.exe dist/

    - name: Upload unsigned artifacts
      uses: actions/upload-artifact@v7
      with:
        name: timestone-unsigned
        path: dist/
        if-no-files-found: error

  sign:
    needs: build
    runs-on: windows-2025
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: timestone-unsigned
        path: dist

    - name: Unpack zip and stage Timestone binaries for signing
      shell: pwsh
      run: |
        Expand-Archive -Path dist\Timestone.zip -DestinationPath work -Force
        New-Item -ItemType Directory -Path sign -Force | Out-Null
        Copy-Item work\Timestone.asi sign\Timestone.dll -Force   # .asi is a PE DLL; not in ArtifactSigning's type list
        Copy-Item work\TimestoneUpdater.exe sign\ -Force   # dinput8.dll (ASI loader) stays unsigned

    - name: Sign with Azure Artifact Signing
      uses: azure/artifact-signing-action@v2
      with:
        endpoint: https://eus.codesigning.azure.net/
        signing-account-name: Timestone
        certificate-profile-name: TimestoneTesting
        azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
        azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
        files-folder: ${{ github.workspace }}\sign
        files-folder-filter: dll,exe
        file-digest: SHA256
        timestamp-rfc3161: http://timestamp.acs.microsoft.com
        timestamp-digest: SHA256

    - name: Verify signatures
      shell: pwsh
      run: |
        $files = Get-ChildItem sign\*.dll, sign\*.exe
        foreach ($f in $files) {
          $sig = Get-AuthenticodeSignature $f.FullName
          if ($sig.Status -ne 'Valid') {
            throw "Signature invalid for $($f.Name): $($sig.Status)"
          }
          Write-Host "Signed: $($f.Name) status=$($sig.Status) cert=$($sig.SignerCertificate.Subject)"
        }

    - name: Restore .asi name and rebuild zip
      shell: pwsh
      run: |
        Copy-Item sign\Timestone.dll dist\Timestone.asi -Force
        Copy-Item sign\TimestoneUpdater.exe dist\ -Force
        Copy-Item work\dinput8.dll dist\ -Force   # unsigned — original from the zip
        Remove-Item dist\Timestone.zip -Force
        Compress-Archive -Path dist\dinput8.dll, dist\Timestone.asi, dist\TimestoneUpdater.exe -DestinationPath dist\Timestone.zip

    - name: Upload signed artifacts
      uses: actions/upload-artifact@v7
      with:
        name: timestone-signed
        path: dist/
        if-no-files-found: error

  release:
    needs: [build, sign]   # build needed for outputs.version
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: timestone-signed
        path: dist

    - name: Create GitHub release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ needs.build.outputs.version }}
        name: Timestone ${{ needs.build.outputs.version }}
        files: dist/Timestone.zip
        body: |
          Please join the discord if you are going to test this!!!
          https://discord.gg/BvDNwPzwy4

          MAKE SURE YOU HAVE NO MODS INSTALLED WHEN PLAYING THIS

          Everything is broken, desyncs occassionally, crashes occassionally

          To install, extract the contents of Timestone.zip into your marvel folder

          Primary connection method is Steam Lobby, make a lobby or search for lobbies and join. You can use invite to game in Steam, and you can right click join when someone is hosting a lobby.

          There is an issue with BITDEFENDER. Bitdefender WILL crash your game, please add an exclusion for marvel folder / disable it

          Credits

          Armonte- Many reverse engineering and documentation, Shot snapshot base, inspiration from his repo (exception handler.. etc)

          Hkhann- Prior reverse engineering, the one who started it all with the OG UMVC3Rollback repo

          catboy_friender- Help with Hkhann's repo

          Eternal Yoshi- Prior reverse engineering, playtesting

          Ryn (wistfulhopes), anotak, Gneiss- Prior reverse engineering

          Archeroflegend- Framestepper, playtesting and harassment

          ermaccer- UMVC3Hook

          Vevota- Playtesting and harassment

          John2143- "Sponsorship"

          Those random guys who played with me in an ingame lobby one day
