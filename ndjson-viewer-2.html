<title>UMVC3 Rollback Diagnostics</title>

#app { display:none; height:100vh; flex-direction:column; }

  state.playRemainder+=(timestamp-state.playTime)*Number($('speed').value)/1000;
  state.playTime=timestamp;
  const steps=Math.floor(state.playRemainder+1e-7);
  if(steps>0) {
    state.playRemainder=Math.max(0,state.playRemainder-steps);
    state.index=Math.min(state.frames.length-1,state.index+steps);
    if(state.index>=state.frames.length-1) { stopPlayback(); return; }
    update(true);
  }
  state.playTimer=requestAnimationFrame(playbackTick);
}
function startPlayback() {
  if(state.playing || state.frames.length<2) return;
  if(state.index>=state.frames.length-1) state.index=0;
  state.playing=true; $('play').textContent='⏸ Pause';
  update();
  state.playTime=performance.now(); state.playRemainder=0;
  state.playTimer=requestAnimationFrame(playbackTick);
}
function togglePlayback() { if(state.playing) stopPlayback(); else startPlayback(); }
function preventDocumentDrop(event) { event.preventDefault(); }
function loadDroppedFiles(event, target) {
  event.preventDefault();
  target.classList.remove('drag-over', 'over');
  const dropped = Array.from(event.dataTransfer.files);
  if (dropped.length) load(dropped);
}
$('dropbox').onclick=()=>$('files').click();
$('dropbox').ondragover=e=>{e.preventDefault();$('dropbox').classList.add('over')};
$('dropbox').ondragleave=()=> $('dropbox').classList.remove('over');
$('dropbox').ondrop=e=>loadDroppedFiles(e, $('dropbox'));
$('app').ondragover=e=>{e.preventDefault();$('app').classList.add('drag-over')};
$('app').ondragleave=e=>{if (!e.relatedTarget || !$('app').contains(e.relatedTarget)) $('app').classList.remove('drag-over')};
$('app').ondrop=e=>loadDroppedFiles(e, $('app'));
document.addEventListener('dragover', preventDocumentDrop);
document.addEventListener('drop', preventDocumentDrop);
$('files').onchange=e=>{load(Array.from(e.target.files));e.target.value=''};
$('open').onclick=()=>$('files').click();
$('clear').onclick=()=>{stopPlayback();state.dumps=[];state.frames=[];state.index=0;$('app').classList.remove('active');$('drop').style.display='grid';update()};
$('first').onclick=()=>{state.index=0;update()};
$('last').onclick=()=>{state.index=state.frames.length-1;update()};
$('prev').onclick=()=>move(-1);
$('next').onclick=()=>move(1);
$('slider').oninput=e=>{state.index=Number(e.target.value);update()};
$('play').onclick=togglePlayback;
$('speed').oninput=()=>{ $('speedValue').textContent=`${$('speed').value} fps`; state.playTime=performance.now(); state.playRemainder=0; };
document.addEventListener('visibilitychange',()=>{state.playTime=performance.now();state.playRemainder=0;});
$('showBench').onchange=update;
$('showCollision').onchange=update;
$('showRegions').onchange=update;
$('calculateCharacters').onchange=()=>{
  $('showCharacters').disabled=!$('calculateCharacters').checked;
  if(!$('calculateCharacters').checked) $('showCharacters').checked=false;
  update();
};
$('showCharacters').onchange=update;
$('showDifferences').onchange=()=>{$('differencePanel').hidden=!$('showDifferences').checked;update()};
window.addEventListener('resize',()=>{const frame=currentFrame();if(frame)drawArena(frame.number)});
document.onkeydown=e=>{
  if(e.key==='ArrowLeft'||e.key==='ArrowRight') {
    // Prevent a focused range input from moving once natively and once here.
    e.preventDefault();
    move(e.key==='ArrowLeft'?-1:1);
  }
};
</script>
